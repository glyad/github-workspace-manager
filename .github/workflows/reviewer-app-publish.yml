name: Local reviewer App publication
run-name: Local review ${{ fromJSON(inputs.payload).operationId }}
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Bounded version 1 public review or reply JSON
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: reviewer-app-pr-${{ fromJSON(inputs.payload).prNumber }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'glyad/github-workspace-manager' && github.actor == 'glyad' && github.actor_id == '4238205'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Publish bounded local review and revoke App token
        env:
          REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/governance/reviewer-app-publish.mjs
