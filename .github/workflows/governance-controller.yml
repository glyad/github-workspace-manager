name: Governance controller (inactive)
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number; resolved node/repository identities are independently verified
        required: true
        type: string
      expected_base_ref:
        description: Exact refs/heads base ref selected by the initiating human
        required: true
        type: string
      expected_base_sha:
        description: Expected lowercase 40-hex base SHA; data, never authority
        required: true
        type: string
      expected_head_sha:
        description: Expected lowercase 40-hex head SHA; data, never authority
        required: true
        type: string
      request_id:
        description: Unique 1-128 ASCII alphanumeric/underscore/hyphen request ID
        required: true
        type: string
      protocol_version:
        description: Exact protocol value 2
        required: true
        type: choice
        options: ['2']
  pull_request_target:
    types: [ready_for_review, synchronize, converted_to_draft, closed, reopened, edited]
  workflow_run:
    workflows: [Candidate CI, Candidate review]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: governance-pr-${{ github.repository_id }}-${{ inputs.pr || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'unresolved' }}
  cancel-in-progress: false
jobs:
  controller:
    # Unreachable until separately reviewed live adapter and identity gates pass.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      # Production capability denial precedes every trusted-code recipe.
      - name: Fail closed until authenticated live adapters exist
        run: |
          echo 'Inactive: trusted ledger, native timeline, run attestation and lock adapters unresolved.'
          exit 1
      - name: Deny until independent trusted-source bootstrap exists
        env:
          READINESS_INPUTS: ${{ toJSON(inputs) }}
        run: |
          echo 'Inactive: independently approved runtime source capability unavailable.'
          exit 1
      # Deliberately no runtime checkout/import. github.workflow_sha/ref describe
      # the dispatch-selected definition and are NOT independent source authority.
      # Before code load, a separately reviewed external bootstrap/protected
      # configuration must authenticate the approved default-branch immutable
      # source and executing workflow. No such capability is selected here.
      # That trusted host must load createReadinessRuntime with authenticated
      # providers, then call command({inputs,archive}) with the JSON input data.
      # Local offline acceptance exercises that composition; this YAML does not
      # turn branch-controlled code or environment assertions into trusted code.
